<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="standeeTitle">Shree Kripa Midway Restaurant - Official Table Standee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #ede4e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .print-btn-bar {
            margin-bottom: 22px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #1c0206;
            color: #eed88c;
            border: 1.5px solid #c5a034;
            padding: 11px 24px;
            font-size: 14.5px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            transition: all 0.25s ease;
        }

        .btn:hover {
            background: #34060e;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.35);
        }

        .btn-secondary {
            background: #ffffff;
            color: #1a0205;
            border-color: #c5a034;
        }

        /* Standee Card */
        .standee-card {
            width: 440px;
            height: 700px;
            background: linear-gradient(180deg, #3B0712 0%, #250a10 50%, #19090c 100%);
            border: 2px solid #c5a034;
            border-radius: 24px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
            color: #ffffff;
            text-align: center;
            page-break-inside: avoid;
        }

        .inner-border {
            position: absolute;
            top: 7px;
            left: 7px;
            right: 7px;
            bottom: 7px;
            border: 1px solid rgba(223, 196, 118, 0.45);
            border-radius: 18px;
            pointer-events: none;
        }

        /* Brand Top */
        .brand-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 4px;
        }

        .logo-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65), 0 0 16px rgba(212, 175, 55, 0.4);
        }

        .brand-name {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 0.6px;
            color: #eed88c;
            margin-bottom: 2px;
        }

        .brand-sub {
            font-size: 11.5px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .veg-tag {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #c5a034;
            color: #eed88c;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        /* Middle QR Block */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .scan-heading {
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 9px;
            letter-spacing: 0.8px;
        }

        /* Platform Badges */
        .platform-badges {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .badge-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid #c5a034;
            border-radius: 20px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        .badge-ico {
            width: 17px;
            height: 17px;
            object-fit: contain;
            border-radius: 3px;
        }

        .qr-box {
            background: #ffffff;
            padding: 10px;
            border-radius: 18px;
            border: 2px solid #c5a034;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
            width: 255px;
            height: 255px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-box img {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 4px;
        }

        /* Footer */
        .footer-block {
            width: 100%;
            margin-bottom: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .address-box {
            border: 1.5px solid #c5a034;
            border-radius: 14px;
            padding: 9px 18px;
            width: 92%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin-bottom: 5px;
        }

        .location-title {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .location-text {
            font-size: 11px;
            color: #ffffff;
            line-height: 1.35;
        }

        .phone-text {
            font-size: 14px;
            color: #eed88c;
            font-weight: 800;
            letter-spacing: 0.4px;
            margin-top: 2px;
        }

        .footer-note {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 14.5px;
            color: #eed88c;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-top: 4px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sparkle-icon {
            color: #c5a034;
            font-size: 12px;
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }
            .print-btn-bar {
                display: none !important;
            }
            .standee-card {
                box-shadow: none;
                margin: auto;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <div class="print-btn-bar">
        <button class="btn" onclick="window.print()">🖨️ Print Standee (Ctrl + P)</button>
        <button class="btn btn-secondary" onclick="toggleQRMode()">🔄 Toggle QR (Single / Dual)</button>
        <button class="btn btn-secondary" onclick="window.location.href='index.html'">📱 View Mobile Page</button>
    </div>

    <!-- Printable Table Standee Card -->
    <div class="standee-card" id="printableCard">
        <div class="inner-border"></div>

        <!-- Top: Logo & Title -->
        <div class="brand-header">
            <div class="logo-box">
                <img src="logo_with_gold_rim.png" alt="Shree Kripa Logo" id="stLogo">
            </div>
            <div class="brand-name" id="stName">SHREE KRIPA</div>
            <div class="brand-sub" id="stSub">MIDWAY RESTAURANT</div>
            <div class="veg-tag" id="stTagline">100% PURE VEG • PIGDAMBER, RAU • INDORE</div>
        </div>

        <!-- Middle: QR Block -->
        <div class="qr-section">
            <div class="scan-heading" id="stScanHeading">SCAN TO CONNECT</div>
            <div class="platform-badges" id="stBadges">
                <div class="badge-pill">
                    <img src="google_icon.png" class="badge-ico" alt="Google">
                    <span>Rate Us on Google</span>
                </div>
                <div class="badge-pill">
                    <img src="instagram_icon.png" class="badge-ico" alt="Instagram">
                    <span>Follow Us on Instagram</span>
                </div>
            </div>
            <div class="qr-box">
                <img src="qr_code.png" alt="Scan QR Code" id="stQR">
            </div>
        </div>

        <!-- Bottom: Location, Phone & Footer -->
        <div class="footer-block">
            <div class="address-box">
                <div class="location-title">Shree Kripa Midway Restaurant,</div>
                <div class="location-text" id="stAddress">Near Maharana Pratap Bridge, Pigdamber, Rau, Indore</div>
                <div class="phone-text" id="stPhone">Call / Reservation: 91110 30307</div>
            </div>
            <div class="footer-note">
                <span class="sparkle-icon">✦</span>
                <span id="stFooterThanks">Thank You For Visiting Shree Kripa</span>
                <span class="sparkle-icon">✦</span>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        let currentMode = 'landing'; // 'landing', 'google', 'insta'

        function applyStandeeConfig(cfg) {
            if (!cfg) return;
            if (cfg.restaurantName) {
                document.getElementById('stName').innerText = cfg.restaurantName.toUpperCase();
                document.getElementById('standeeTitle').innerText = `${cfg.restaurantName} Midway Restaurant - Official Table Standee`;
            }
            if (cfg.subtitle) {
                document.getElementById('stSub').innerText = cfg.subtitle.toUpperCase();
            }
            if (cfg.tagline) {
                document.getElementById('stTagline').innerText = cfg.tagline;
            }
            if (cfg.logoImage) {
                document.getElementById('stLogo').src = cfg.logoImage;
            }
            if (cfg.standeeHeading) {
                document.getElementById('stScanHeading').innerText = cfg.standeeHeading;
            }
            if (cfg.shortAddress || cfg.address) {
                document.getElementById('stAddress').innerText = cfg.shortAddress || cfg.address;
            }
            if (cfg.phoneButtonText) {
                document.getElementById('stPhone').innerText = cfg.phoneButtonText;
            }
        }

        function toggleQRMode() {
            const qrImg = document.getElementById('stQR');
            const heading = document.getElementById('stScanHeading');
            const badges = document.getElementById('stBadges');

            if (currentMode === 'landing') {
                currentMode = 'google';
                qrImg.src = 'qr_google_direct.png';
                heading.innerText = 'RATE US ON GOOGLE';
                badges.innerHTML = `
                    <div class="badge-pill">
                        <img src="google_icon.png" class="badge-ico" alt="Google">
                        <span>⭐ Google 5-Star Reviews</span>
                    </div>
                `;
            } else if (currentMode === 'google') {
                currentMode = 'insta';
                qrImg.src = 'qr_instagram_direct.png';
                heading.innerText = 'FOLLOW US ON INSTAGRAM';
                badges.innerHTML = `
                    <div class="badge-pill">
                        <img src="instagram_icon.png" class="badge-ico" alt="Instagram">
                        <span>📸 Follow @shree_kripa_restaurant</span>
                    </div>
                `;
            } else {
                currentMode = 'landing';
                qrImg.src = 'qr_code.png';
                heading.innerText = 'SCAN TO CONNECT';
                badges.innerHTML = `
                    <div class="badge-pill">
                        <img src="google_icon.png" class="badge-ico" alt="Google">
                        <span>Rate Us on Google</span>
                    </div>
                    <div class="badge-pill">
                        <img src="instagram_icon.png" class="badge-ico" alt="Instagram">
                        <span>Follow Us on Instagram</span>
                    </div>
                `;
            }
        }

        if (typeof RESTAURANT_CONFIG !== 'undefined') {
            applyStandeeConfig(RESTAURANT_CONFIG);
        }

        // Bypass mobile browser cache when hosted online
        if (window.location.protocol.startsWith('http')) {
            const url = 'config.js?t=' + Date.now();
            fetch(url, { cache: 'no-store' })
                .then(res => { if (res.ok) return res.text(); throw new Error('Not found'); })
                .then(text => {
                    const fn = new Function(text + '\nreturn (typeof RESTAURANT_CONFIG !== "undefined") ? RESTAURANT_CONFIG : null;');
                    const cfg = fn();
                    if (cfg) applyStandeeConfig(cfg);
                })
                .catch(() => {});
        }
    </script>
</body>
</html>
